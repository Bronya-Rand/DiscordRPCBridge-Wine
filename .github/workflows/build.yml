name: Build and Publish RPC Bridge

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]
    tags:
      - '*.*.*'

jobs:
  build:
    name: "Build RPC Bridge"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: "Setup .NET"
        uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      
      - name: "Install dependencies"
        run: "dotnet restore"
      
      - name: "Build RPC Bridge"
        run: "dotnet build --configuration Release --no-restore"
      
      - name: "Pack RPC Bridge"
        run: "dotnet pack --configuration Release --no-build --output output"

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: output/*.nupkg
        
  publish:
    name: "Publish to NuGet and GitHub Packages"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # For GitHub Release
      id-token: write # For NuGet login
      packages: write # For Github Packages

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: output

      - name: Login to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet Package
        run: |
          dotnet nuget push output/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
      
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push output/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --skip-duplicate
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with: 
          files: output/*.nupkg
          generate_release_notes: true
            