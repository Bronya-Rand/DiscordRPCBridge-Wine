name: Build and Publish RPC Bridge

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]
    tags:
      - '*.*.*'

jobs:
  build:
    name: "Build RPC Bridge"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      
      - name: "Setup .NET"
        uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      
      - name: "Install dependencies"
        run: "dotnet restore"
      
      - name: "Build RPC Bridge"
        run: "dotnet build --configuration Release --no-restore"
      
      - name: "Pack RPC Bridge"
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]] 
          then
            dotnet pack DiscordRPCBridge-Wine/DiscordRPCBridge-Wine.csproj --configuration Release --no-build --output output -p:PackageVersion=${GITHUB_REF_NAME}
          else
            dotnet pack DiscordRPCBridge-Wine/DiscordRPCBridge-Wine.csproj --configuration Release --no-build --output output
          fi

      - name: "Build CLI Standalone Binaries"
        run: |
          mkdir -p output/binaries
          TARGETS=("linux-x64" "osx-arm64")
          for RID in "${TARGETS[@]}"; do
            echo "Publishing for $RID..."
            PUBLISH_DIR="publish/$RID"
            VERSION_ARG=""
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              VERSION_ARG="-p:Version=${GITHUB_REF_NAME}"
            fi

            dotnet publish DiscordRPCBridge-Wine.Cli/DiscordRPCBridge-Wine.Cli.csproj \
              --configuration Release \
              --runtime "$RID" \
              --self-contained \
              -p:PublishSingleFile=true \
              -p:PublishTrimmed=true \
              $VERSION_ARG \
              --output "$PUBLISH_DIR"

            if [[ "$RID" == win-* ]]; then
              zip -j "output/binaries/discord-rpc-bridge-$RID.zip" "$PUBLISH_DIR/discord-rpc-bridge.exe"
            else
              chmod +x "$PUBLISH_DIR/discord-rpc-bridge"
              tar -czf "output/binaries/discord-rpc-bridge-$RID.tar.gz" -C "$PUBLISH_DIR" discord-rpc-bridge
            fi
          done

      - name: "Upload NuGet Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: output/*.nupkg

      - name: "Upload CLI Binaries Artifact"
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: output/binaries/*
        
  publish:
    name: "Publish to NuGet, GitHub Packages, and GitHub Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # For GitHub Release
      id-token: write # For NuGet login
      packages: write # For Github Packages

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: output

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: output/binaries

      - name: Login to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet Package
        run: |
          dotnet nuget push output/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
      
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push output/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --skip-duplicate
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with: 
          files: |
            output/*.nupkg
            output/binaries/*
          generate_release_notes: true
            